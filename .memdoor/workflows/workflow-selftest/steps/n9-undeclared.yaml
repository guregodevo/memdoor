type: command
requires:
  - table_pattern: setup
command: |-
  T="${TMPDIR:-/tmp}/memdoor-selftest-{{.partition}}"; cd "$T" || exit 1; M=${MEMDOOR_BIN:-memdoor}
  N=n9-undeclared; pass(){ echo "PASS $N — $*" > results/$N.txt; }; fail(){ echo "FAIL $N — $*" > results/$N.txt; }
  s=$(./t.sh run n9-undeclared)
  echo "$s" | grep -q "· failed ·" && echo "$s" | grep -q "is it required" && pass "undeclared output refused with the hint" || fail "$(echo "$s" | grep "· run " | head -1)"
target:
  command: test -f "${TMPDIR:-/tmp}/memdoor-selftest-{{.partition}}/results/n9-undeclared.txt"
timeout: 3m
