type: command
requires:
  - table_pattern: setup
command: |-
  T="${TMPDIR:-/tmp}/memdoor-selftest-{{.partition}}"; cd "$T" || exit 1; M=${MEMDOOR_BIN:-memdoor}
  N=n14-schema-impossible; pass(){ echo "PASS $N — $*" > results/$N.txt; }; fail(){ echo "FAIL $N — $*" > results/$N.txt; }
  s=$(./t.sh run n14-schema-impossible)
  echo "$s" | grep -q "· failed ·" && echo "$s" | grep -qi "schema" && pass "no answer could match the schema: retried, then failed naming it" || fail "$(echo "$s" | grep -E '· run |schema' | head -2 | tr '\n' ' ')"
target:
  command: test -f "${TMPDIR:-/tmp}/memdoor-selftest-{{.partition}}/results/n14-schema-impossible.txt"
timeout: 10m
