type: command
# The lean review's first three P0s, for p0-check-1..3 to weigh one by one:
# a small model asked about several at once answers in a pattern (AFTER,
# BEFORE) rather than per finding. A fourth is kept unchecked. Each
# check reads the same trimmed diff as the review, in the same words and
# first, so the model's cache serves it: a CPU prefills it once, not four times.
when: test -s .memdoor/runs/pr-team-review-{{.partition}}.md
command: |
  r=.memdoor/runs/pr-team-review-{{.partition}}
  rm -f "$r".p0-1 "$r".p0-2 "$r".p0-3
  grep -E '^[[:space:]]*[-*][[:space:]]+(\*\*|\[)?P0([^0-9]|$)' "$r".md | head -3 |
    awk -v r="$r" '{ print > (r ".p0-" NR) }'
  ls "$r".p0-? 2>/dev/null | wc -l | tr -d ' '
requires:
  - table_pattern: merge
timeout: 1m
max_retries: 0
