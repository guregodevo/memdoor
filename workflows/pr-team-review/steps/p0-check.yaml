type: llm
each: [1, 2, 3]
model: thinking off
# (p0-check-1, -2, -3: one file, each:) A second look at the review's P0 number {{.item}}, on the same model, asked
# one question it answers well: is it a fault of the code after the change, or
# of the code before it? A small model files what a change fixes as its fault
# (Qwen3-8B failed a correct pull request that way, guregodevo/llamafit#11,
# 2026-10-29); verdict demotes a P0 answered BEFORE to P2. This question: 21
# of 21 on that model over three false P0s and four real ones.
when: test -s .memdoor/runs/pr-team-review-{{.partition}}.p0-{{.item}}
prompt: |
  Here is a code change: a unified diff, lines starting with + are added, lines starting with - are removed.

  ```diff
  {{ file (printf ".memdoor/runs/pr-team-review-%s.lean.diff" .partition) }}
  ```

  A reviewer says of this change:
  {{ file (printf ".memdoor/runs/pr-team-review-%s.p0-%s" .partition .item) }}

  Is that a problem of the code AFTER the change (it breaks something that worked before), or a problem of the code BEFORE the change that the change removes?

  Answer with one word: AFTER or BEFORE.
requires:
  - table_pattern: p0-list
target:
  file: .memdoor/runs/pr-team-review-{{.partition}}.p0check-{{.item}}
timeout: 20m
max_retries: 0
