type: template
# The commit messages the description is written from. Uncommitted work has none.
requires:
  - table_pattern: log
text: |
  {{ output "log" | trim | default "(no commit messages: the change is uncommitted work)" }}
target:
  file: .memdoor/runs/pr-description-{{.partition}}.commits
timeout: 1m
max_retries: 0
