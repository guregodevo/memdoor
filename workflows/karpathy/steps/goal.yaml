type: agent
agent: coder
model: thinking medium
# Adds a test and a check that fails on the tree as it is, before any fix.
# Rule 4, goal-driven. Its target proves the failure: a check that passes
# already tests nothing.
prompt: |
  The task:

  {{ file (printf ".memdoor/runs/karpathy-%s/prompt.md" .partition) }}

  The assumptions the person approved, which win over the task where they differ:

  {{ file (printf ".memdoor/runs/karpathy-%s/assumptions.md" .partition) }}

  Start from what the last step left in `.memdoor/runs/karpathy-{{.partition}}/lab/` ("Done when" names it): reuse a brute force, a reference or a reproduction found there instead of writing a new one, and write only what is missing.

  Write the check from "Done when" before any fix: an executable `.memdoor/runs/karpathy-{{.partition}}/check`, run from the project's root, that exits non-zero now and 0 once the task is done. Use the project's own test runner where it has one: add a test that reproduces the bug or asks for the feature to the project's own test files, where it stays as part of the change, and have the check run the project's tests. Run the check and see it fail for the right reason. Do not change any code but the test.
requires:
  - table_pattern: think-before-coding
  - table_pattern: approve
    external: true
target:
  command: '[ -x .memdoor/runs/karpathy-{{.partition}}/check ] && ! .memdoor/runs/karpathy-{{.partition}}/check'
budget: 300000
timeout: 20m
max_retries: 1
