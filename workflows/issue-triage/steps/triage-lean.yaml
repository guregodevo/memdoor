type: llm
model: thinking off
# The triage in one model call, for a slow model (MEMDOOR_LEAN: the GitHub
# Action sets it with local-model, a model on the runner's CPU): the issue,
# the labels and the open issues all inlined in the prompt, no tools, no loop.
# The agent's triage (triage.yaml) runs instead when it is not set.
when: '[ -n "${MEMDOOR_LEAN:-}" ]'
prompt: |
  You triage an issue. The issue:

  {{ file (printf ".memdoor/runs/issue-triage-%s.context" .partition) }}

  The repository's labels, one per line:

  {{ file (printf ".memdoor/runs/issue-triage-%s.labels" .partition) }}

  The open issues, "#number title" per line:

  {{ file (printf ".memdoor/runs/issue-triage-%s.open" .partition) }}

  Write the triage in exactly this Markdown shape, and nothing else (no code fence around it):

  labels: <the names of the labels above that fit, comma-separated; a name not in the list above is never used; when none fits, nothing after the colon>

  ## Kind
  <one word: bug, feature, question or docs>

  ## Summary
  <two sentences: what the reporter says, and what they ask for>

  ## Possible duplicates
  <a list of the open issues above whose title is about the same problem, each `- #number — why`; only numbers from the list above; when none is, the word none>

  ## Missing
  <a list of what the report lacks to act on it (the version, steps to reproduce, logs); only what is really absent from the issue; when nothing is, the word nothing>
requires:
  - table_pattern: context
target:
  file: .memdoor/runs/issue-triage-{{.partition}}.md
timeout: 30m
max_retries: 0
