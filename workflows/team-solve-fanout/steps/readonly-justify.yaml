type: llm
# One call on the task and the old tests the change broke: does the Prompt ask for each to change?
# Skipped when readonly found none. A fix often must change an old test (the
# behaviour the issue asks to change is pinned by one): those are PASS. A
# broken test whose behaviour the Prompt does not ask to change is FAIL, and
# repair runs on it. The run's other verdicts are unchanged.
system: "You answer in this one message. You have no tools: you cannot open a file, list a directory or run a command, and nothing you write will be run. Everything you need is in the message. Do not say what you will look at: answer. Start your answer with the line verdict: PASS or verdict: FAIL."
when: test -s .memdoor/runs/team-solve-fanout-{{.partition}}/readonly.txt
requires:
  - table_pattern: readonly
prompt: |
  # The task

  {{ file (printf ".memdoor/runs/team-solve-fanout-%s/task.md" .partition) }}

  {{ file (printf ".memdoor/runs/team-solve-fanout-%s/readonly.md" .partition) }}

  Each test listed above passed on the tree as the run found it. The change edited the test file, and with the file as it was, the test fails. For each test, decide from the task's Prompt: does the Prompt ask to change the behaviour this test checks? A test that pins the very behaviour the Prompt asks to change is one the fix must change. A test of a message, a warning, a sibling case or a default the Prompt does not mention is one the change broke.

  Answer `verdict: PASS` when every listed test checks behaviour the Prompt asks to change. Otherwise `verdict: FAIL`. Then one line per test: its name, required or broken, and why. On FAIL, end with the repair instructions: which code to change so each broken test passes as it was, and that those test files go back to how they were.
target:
  file: .memdoor/runs/team-solve-fanout-{{.partition}}/readonly-verdict.md
# Optional: without a verdict, the run goes on as it would without readonly.
optional: true
timeout: 20m
max_retries: 1
