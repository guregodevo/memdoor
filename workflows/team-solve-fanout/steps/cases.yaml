type: agent
agent: coder
# Lists the cases the task leaves unstated, each settled by the task's words, else by what sibling code already does, else unclear.
# One read-only turn after the survey, before the attempts. Where right and
# wrong attempts tie on every check, the wrong ones take the other side of a
# case the task never states: a field in a multi-field constraint
# (django-12774), the name form for every kind of Enum (django-11815), other
# invalid values (django-13023), the column names in the same query
# (django-13807). Asked only this, three times each on those runs' trees
# (SWE-bench Verified, DeepSeek V4.1 Flash, 2026-11-11), the agent stated the
# deciding case as the reference fix has it in 14 of the 21 lists it wrote and
# contradicted no hidden test; on django-12308 and -11532 the lists left it
# unclear or unstated, and on django-11087 all three ran out of time. From the
# task alone, without the code, it said unclear on most.
# Sibling code only, never the current behaviour of the code the task
# changes: on astropy-14365 a list read `v == "NO"` in the function the task
# makes case-insensitive and stated that a lower-case `no` stays a value; the
# two attempts that read it kept it, the one that did not was right, and the
# pick followed the two (2026-11-12). The deciding cases above were each
# settled by sibling code. With that rule alone, the next list cited another
# exact match in the package as a sibling and stated the same wrong rule: the
# task's reason ("QDP itself is not case sensitive") covers the marker, so the
# task's reason comes first and no code narrows it.
# The attempts other than the first read cases.md, as they read the survey.
# The path checks do not: the lists disagree on cases no test covers, and a
# check built on one would fail a right attempt.
# Optional: without it the attempts work from the prompt and the survey.
optional: true
requires:
  - table_pattern: survey
prompt: |
  The task is in .memdoor/runs/team-solve-fanout-{{.partition}}/prompt.md. Do not do it, and change no file of the project. The code paths it goes through are listed in .memdoor/runs/team-solve-fanout-{{.partition}}/survey.md when it is there: start from them.

  Several people will each write a change for this task on their own. Where the task leaves a case unstated, they will decide it differently. Find those cases: inputs or situations on the same behaviour that the task's example does not cover. Another kind or form of the input (a combined, nested or multi-part one, a subclass or variant), an empty or missing value, a value that cannot be handled, another place that produces the same output.

  For each case, find what settles it, in this order:
  1. the task's own words, and the reason it gives, applied to every case that reason covers. When the reason covers a case, it settles it: no code narrows it to the task's example;
  2. only for a case the task's words and reason do not cover: what this project's code already does in the same kind of case elsewhere, a sibling function, a parallel class or backend, the same kind of value handled in another place. Read that code and name the file and function. Never the current behaviour of the code the task changes: that is what the task may change;
  3. otherwise `unclear`. `unclear` is better than a rule nothing here supports.

  Read and search only: do not run the project's code or its tests. Keep no rule with the notes tool. Do not spawn agents.

  Write .memdoor/runs/team-solve-fanout-{{.partition}}/cases.md as soon as you have a first case, then improve it: a turn that ends without it has done nothing. At most eight lines and nothing else:
  - <case>: <behaviour, or unclear> (<the task's words, or file:function and what it does there>)
target:
  file: .memdoor/runs/team-solve-fanout-{{.partition}}/cases.md
timeout: 20m
max_retries: 0
