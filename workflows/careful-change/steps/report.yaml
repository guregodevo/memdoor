type: template
# Writes report.md: the assumptions, the review and the diff stat.
requires:
  - table_pattern: verify
  - table_pattern: review
text: |
  ## careful-change

  {{ file (printf ".memdoor/runs/careful-change-%s/assumptions.md" .partition) }}

  ## Review

  {{ output "review" }}

  ## Changed

  ```
  {{ output "verify" }}
  ```
target:
  file: .memdoor/runs/careful-change-{{.partition}}/report.md
