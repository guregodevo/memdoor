type: command
# Saves attempt c as a patch and puts the tree back for the next attempt.
requires:
  - table_pattern: direct-c
command: |
  r=.memdoor/runs/team-solve-{{.partition}}
  w=.memdoor/workflows/team-solve; [ -d "$w" ] || w="$HOME/.memdoor/workflows/team-solve"
  bash "$w/snapshot.sh" save "$r" c
  [ -x "$r/attempt-c" ] && echo "attempt c: check written" || echo "attempt c: no check written"
  bash "$w/snapshot.sh" reset "$r"
timeout: 5m
max_retries: 0
