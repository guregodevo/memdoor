type: command
# Puts in the tree the attempt the other attempts' checks pass most.
# The pick, from the attempts' own checks (cross.sh, which the fan-out ran
# after its last wave): each attempt's check runs on the tree as found (where
# it must fail, or it proves nothing) and on each other attempt's change; an
# attempt scores one point per other check it passes. The highest score goes
# into the tree; a tie goes to the smaller change. Offline on SWE-bench
# Verified (2026-11-07, #159): where the attempts' checks told them apart, the
# pick was right 11 times of 12; where every attempt passed every check, the
# tie-break was a coin toss, and the fan-out adds attempts there. An attempt
# never scores on its own check. With no check at all the smallest change stands.
requires:
  - table_pattern: direct
command: |
  r=.memdoor/runs/team-solve-{{.partition}}
  w=.memdoor/workflows/team-solve; [ -d "$w" ] || w="$HOME/.memdoor/workflows/team-solve"
  [ -s "$r/pick-points.txt" ] || bash "$r/cross.sh" "$r" > /dev/null
  [ -s "$r/pick-points.txt" ] || { echo "picked: nothing (no attempt changed the tree)" | tee "$r/pick.txt"; exit 0; }
  best=$(sort -k2,2nr -k3,3n "$r/pick-points.txt" | head -1 | cut -d' ' -f1)
  bash "$w/snapshot.sh" restore "$r" "attempts/$best" > /dev/null
  summary=$(awk '{printf "%s%s %s", (NR>1?", ":""), $1, $2}' "$r/pick-points.txt")
  echo "picked: attempt $best ($(grep -c 'FAILS\|passes$' "$r/pick-matrix.txt" 2>/dev/null) cross-checks; points: $summary; a tie goes to the smaller change)" | tee "$r/pick.txt"
  cat "$r/pick-matrix.txt" 2>/dev/null
timeout: 45m
max_retries: 0
