type: agent
agent: coder
# The single call: one agent turn on the prompt as written, while plan works beside it.
# The single call, first, while plan writes the task beside it: one turn on
# the person's prompt as they wrote it, in the tree. When its attempt passes
# the Check and the Scope (test-0), the team after it only verifies; when it
# does not, the ideators and the solver take over from it. A single call fixed
# two scoped tasks in a minute and lost its way on an open-ended one that the
# team passed (2026-11-05, #84, #93): first the minute, then the team if needed.
# Its target is a changed tree (done.sh direct): a turn stopped at its clock
# that changed something is a finished attempt, and test-0 judges it; one
# that changed nothing is passed over (optional) and the team starts from
# nothing. Thirteen runs of 500 ended here unchecked (2026-11-06, #151).
optional: true
requires:
  - table_pattern: problem
prompt: |
  {{ file (printf ".memdoor/runs/team-solve-%s/prompt.md" .partition) }}

  Do not commit, check out, reset or stash: the tree's HEAD stays where it is. Write what the task asks for as soon as you have a first version, then improve it: a turn that ends without it has done nothing. Keep no rule with the notes tool (it writes the project's AGENTS.md), and leave .memdoor/ alone.
target:
  command: bash .memdoor/runs/team-solve-{{.partition}}/done.sh direct .memdoor/runs/team-solve-{{.partition}}
timeout: 30m
max_retries: 0
