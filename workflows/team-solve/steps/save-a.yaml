type: command
# Saves attempt a as a patch and puts the tree back for the next attempt.
requires:
  - table_pattern: direct-a
command: |
  r=.memdoor/runs/team-solve-{{.partition}}
  w=.memdoor/workflows/team-solve; [ -d "$w" ] || w="$HOME/.memdoor/workflows/team-solve"
  bash "$w/snapshot.sh" save "$r" a
  [ -x "$r/attempt-a" ] && echo "attempt a: check written" || echo "attempt a: no check written"
  bash "$w/snapshot.sh" reset "$r"
timeout: 5m
max_retries: 0
