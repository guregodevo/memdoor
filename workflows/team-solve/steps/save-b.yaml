type: command
# Saves attempt b as a patch and puts the tree back for the next attempt.
requires:
  - table_pattern: direct-b
command: |
  r=.memdoor/runs/team-solve-{{.partition}}
  w=.memdoor/workflows/team-solve; [ -d "$w" ] || w="$HOME/.memdoor/workflows/team-solve"
  bash "$w/snapshot.sh" save "$r" b
  [ -x "$r/attempt-b" ] && echo "attempt b: check written" || echo "attempt b: no check written"
  bash "$w/snapshot.sh" reset "$r"
timeout: 5m
max_retries: 0
