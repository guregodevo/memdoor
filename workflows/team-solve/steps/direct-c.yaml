type: agent
agent: coder
# Attempt c of three: one agent turn on the prompt as written, on the tree as found.
# Three attempts, one after another on the same clean tree, each saved as a
# patch (save-c) and judged by the others' checks (pick): on SWE-bench
# Verified one of three attempts was right on 85% of the instances and one
# attempt on 78% (2026-11-07, #159). Each attempt also writes a check that
# fails on the tree as found and passes with its change, the currency the
# pick trades in.
optional: true
requires:
  - table_pattern: save-b
prompt: |
  {{ file (printf ".memdoor/runs/team-solve-%s/prompt.md" .partition) }}

  The code paths this task goes through are listed in .memdoor/runs/team-solve-{{.partition}}/survey.md when it is there, siblings included: change each one the task's behaviour goes through, not only the one its example uses.

  Do not commit, check out, reset or stash: the tree's HEAD stays where it is. Write what the task asks for as soon as you have a first version, then improve it: a turn that ends without it has done nothing. Keep no rule with the notes tool (it writes the project's AGENTS.md), and leave .memdoor/ alone.
  Also write .memdoor/runs/team-solve-{{.partition}}/attempt-c: one executable (chmod +x) that, run from the project's root, exits non-zero on the tree as you found it and 0 with your change, the smallest check that shows your change does what the prompt asks, in whatever this project runs. It is not part of the change: nothing else goes into .memdoor/.
target:
  command: bash .memdoor/runs/team-solve-{{.partition}}/done.sh direct .memdoor/runs/team-solve-{{.partition}}
timeout: 30m
max_retries: 0
