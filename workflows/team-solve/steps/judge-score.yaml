type: decision
# Scores the judge: how likely the change does what the Prompt asks, from its reasons.
# Runs when the judge ran (its verdict is there), and scores what it wrote with
# what the final Check printed (#160). `pass` in its JSON is what keep and
# verify read. Without a decision model the answer is judge-rule's,
# today's rule, a task of the DAG.
when: "[ -s .memdoor/runs/team-solve-{{.partition}}/verdict.md ]"
requires:
  - table_pattern: judge
  - table_pattern: judge-rule
  - table_pattern: recheck
condition: "Judging from the judge's reasons and what the final Check printed, the change does what the task's Prompt asks, completely and nothing else."
state: |
  # The task

  {{ file (printf ".memdoor/runs/team-solve-%s/task.md" .partition) }}

  # The judge's verdict and reasons

  {{ file (printf ".memdoor/runs/team-solve-%s/verdict.md" .partition) }}

  # What the final Check printed, and its status (0 passed, 1 failed, none: nothing could be run)

  {{ output "recheck" }}
# The threshold is measured, not the 0.7 default (2026-11-07): on the 405
# attempts the reviewer passed on SWE-bench Verified (340 right, 65 wrong),
# overturning a PASS lost more right attempts than it caught wrong ones at
# every threshold (0.7: 106 right kept, 54 wrong caught, net -180; 0.3: net
# -55; 0.1: 338 kept, 0 caught, net -2). The decision model reads the
# reviewer's evidence and cannot see what the hidden tests check. At 0.1 it
# fails a verdict only on near-certain evidence; its p stays in the JSON.
threshold: 0.1
else: judge-rule
target:
  file: .memdoor/runs/team-solve-{{.partition}}/judge-score.json
timeout: 5m
max_retries: 0
