type: llm
# The planner: one call, no tools, on the outline (outline.yaml). It settles
# what the work is checked against; settle.yaml writes its sections into
# task.md, so the Prompt stays as the person wrote it. A first worker does the
# task beside it at the same time (direct.yaml).
system: "You answer in this one message. You have no tools: you cannot open a file, list a directory or run a command, and nothing you write will be run. Everything you need is in the message. Do not say what you will look at: answer. Start your answer with the line ## Deliverable."
requires:
  - table_pattern: outline
prompt: |
  {{ file (printf ".memdoor/runs/team-solve-%s/outline.md" .partition) }}

  You are the planner of a team that does the task in the prompt above, in this project. Settle what the work is checked against. Answer with exactly these five sections, in this order, and nothing before them:

  ## Deliverable
  "changes to this tree" when the task changes the project; or the new files by name (a program: solution.py, Python standard library only, stdin in, the answer alone on stdout; a document: answer.md).

  ## Check
  One command in backticks that exits 0 when the work is right: the one the prompt names when it names one, else the project's own (`go test ./pkg/x/`, `npm test`, `make check`), scoped to what the task touches. The word samples when tests/N.in and tests/N.out are in the files above. The word judge when nothing can be run.

  ## Scope
  Each file or directory the work may touch, in backticks, one per line (`scripts/scan.sh`, `docs/`). What the prompt allows is the Scope: when it says "files under cmd/cli/cmd/ only", the Scope is `cmd/cli/cmd/`. A new file whose name the prompt does not give (a test to add, a page to write) is covered by its directory, never by a name you guess: a guessed `auth_test.go` failed a correct `auth_status_test.go` (2026-11-05). `.` only when the task is the whole tree.

  ## Done when
  What the reviewer and the judge check, one line each, each a thing the prompt asks for, in the prompt's terms. Nothing the prompt does not ask: not the project's conventions (a changelog entry, docs, a release note), not a test of the shape you would write, not a wording the prompt does not give. A line you infer because the prompt is unclear starts with `(inferred)`.

  ## Approach
  The decomposition, and two or three candidate approaches with their tradeoffs, for the solver if the first attempt fails.
target:
  file: .memdoor/runs/team-solve-{{.partition}}/plan.md
timeout: 20m
max_retries: 1
