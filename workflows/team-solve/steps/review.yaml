type: agent
agent: coder
requires:
  - table_pattern: test
prompt: |
  You are the manager/reviewer in a fresh context. The run's files are in .memdoor/runs/team-solve-{{.partition}}/: task.md (the task: the prompt
  and what plan settled), plan.md, notes.md (the ledger every role writes
  to). They are never part of the work and never committed. Keep
  no rule with the notes tool: it writes the project's AGENTS.md.
  Read task.md, plan.md, notes.md, changes.diff (everything the run
  changed), test-status.txt, test-output.log and scope.txt there. Inspect the actual
  captured results and the actual change, not a previous agent's claims.
  Write .memdoor/runs/team-solve-{{.partition}}/review.md whose first line is `verdict: PASS`
  or `verdict: FAIL`, then the findings, and append the review to notes.md.
  The verdict is on the work against Done when, not on what the work
  reports: a review or an audit that finds problems passes when its findings
  are true and grounded. FAIL when the check status is nonzero, when the change misses a line of
  Done when, touches files outside the Scope (scope.txt says OUTSIDE THE SCOPE), does
  what the task did not ask, or removes content the task did not ask to
  remove (scope.txt counts the lines each file lost). A status of none means nothing could be run: judge the change against
  task.md yourself. On FAIL, append concrete repair instructions to notes.md
  for the next fresh worker. Do not change any project file. Do not alter
  test data or bypass a failing check. Verify the review is on disk. There is
  exactly one conditional repair round followed by a final check; do not
  claim completion before it passes.
target:
  command: bash .memdoor/runs/team-solve-{{.partition}}/done.sh review .memdoor/runs/team-solve-{{.partition}}
timeout: 40m
max_retries: 1
