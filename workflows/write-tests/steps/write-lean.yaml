type: llm
model: thinking off
# On a local model: one call writes one new test file; land writes it and
# check keeps it only when the tests pass with it.
when: test -s .memdoor/runs/write-tests-{{.partition}}.newpath && [ -n "${MEMDOOR_LEAN:-}" ]
prompt: |
  You write tests for a code change. The diff (lines starting with + are added, - removed):

  ```diff
  {{ file (printf ".memdoor/runs/write-tests-%s.diff" .partition) }}
  ```

  The changed files, and an existing test of this project to follow for style:

  {{ file (printf ".memdoor/runs/write-tests-%s.ctx" .partition) }}

  Write ONE NEW test file, `{{ file (printf ".memdoor/runs/write-tests-%s.newpath" .partition) }}`, in the same package as the changed code and in the project's style. Test each function the change touches: its normal case, one edge case, and the case the change is about. A test asserts what the code should do. Only what the code above shows exists; never call a function or a helper you cannot see. The file holds test functions only (`func TestXxx(t *testing.T)`): the code under test is already in the package, so never copy or redeclare it.

  Answer with the whole file in one fenced code block, and nothing else.
requires:
  - table_pattern: lean-context
target:
  file: .memdoor/runs/write-tests-{{.partition}}.answer
timeout: 30m
max_retries: 0
