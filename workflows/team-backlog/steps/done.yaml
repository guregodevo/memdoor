type: command
# The worktree goes; the branch stays, with the pull request or the comment as the outcome.
when: test -n "{{ output "next" | trim }}"
requires:
  - table_pattern: pr
  - table_pattern: comment
  - table_pattern: branch
command: |
  git worktree remove --force {{ output "branch" | trim }} && git worktree prune
timeout: 5m
max_retries: 0
