type: command
# team-solve on the issue, in the worktree, as it is. Its output is `exit 0` when its Check passed.
args:
  model: ""   # the model every step of team-solve runs on; empty: the gateway's own choice
when: test -n "{{ output "next" | trim }}"
requires:
  - table_pattern: task
  - table_pattern: branch
command: |
  memdoor workflow run team-solve --dir {{ output "branch" | trim }} --timeout 3h --wait {{ if .model }}--model {{.model}} {{ end }}- < .memdoor/runs/team-backlog/steps/task/{{.partition}} > /dev/null 2>&1; echo "exit $?"
timeout: 4h
max_retries: 0
