type: command
# The next open issue nobody is on: unassigned, no linked pull request, no comment of ours.
args:
  label: ""           # only issues with this label; empty: any open issue
  max_open_prs: "1"   # this account's pull requests open at once; at the cap nothing starts
when: test "$(gh pr list --state open --author @me --json number --jq length)" -lt {{.max_open_prs}}
command: |
  gh issue list --search 'no:assignee -linked:pr -commenter:@me {{ if .label }}label:"{{.label}}" {{ end }}sort:created-asc' --limit 1 --json number --jq '.[0].number // empty'
timeout: 2m
max_retries: 0
