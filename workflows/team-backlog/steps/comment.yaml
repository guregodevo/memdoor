type: command
# When the team did not pass, a comment on the issue with what it found.
when: test -n "{{ output "next" | trim }}" && test "{{ output "solve" | trim }}" != "exit 0"
requires:
  - table_pattern: comment-body
command: |
  gh issue comment {{ output "next" | trim }} --body-file .memdoor/runs/team-backlog-{{.partition}}-comment.md
timeout: 5m
max_retries: 0
