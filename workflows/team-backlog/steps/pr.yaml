type: command
# The pull request that closes the issue. Its output is the URL.
when: test "{{ output "solve" | trim }}" = "exit 0"
requires:
  - table_pattern: commit
  - table_pattern: pr-body
command: |
  gh pr create --head memdoor/issue-{{ output "next" | trim }} --title "$(gh issue view {{ output "next" | trim }} --json title --jq .title)" --body-file .memdoor/runs/team-backlog-{{.partition}}-pr.md
timeout: 5m
max_retries: 0
