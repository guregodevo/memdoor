type: command
# The fix the Check passed goes up as a pull request that closes the issue.
# It carries what the team found: keep's line, the Check, the review and the judge.
when: test "$(cat .memdoor/runs/team-backlog-{{.partition}}/solve-status.txt 2>/dev/null)" = 0
requires:
  - table_pattern: solve
command: |
  set -eu
  r=.memdoor/runs/team-backlog-{{.partition}}; n=$(cat "$r/number.txt"); wt=$(cat "$r/worktree.txt"); run=$(cat "$r/solve-run.txt")
  title=$(gh issue view "$n" --json title --jq .title)
  git -C "$wt" add -A -- . ':(exclude).memdoor'
  if git -C "$wt" diff --cached --quiet; then echo "nothing to commit: the run changed no file" | tee "$r/summary.txt"; exit 0; fi
  git -C "$wt" -c user.name="memdoor" -c user.email="memdoor@localhost" commit -q -m "$title (#$n)"
  git -C "$wt" push -q -u origin "memdoor/issue-$n"
  {
    printf 'Closes #%s.\n\nteam-solve, run `%s`:\n\n- %s\n- the Check: %s\n' "$n" "$(basename "$run")" "$(head -1 "$run/keep.txt" 2>/dev/null || echo 'keep: not reached')" "$(cat "$run/check-kind.txt" 2>/dev/null || echo '?') $(cat "$run/final-status.txt" 2>/dev/null || cat "$run/direct-status.txt" 2>/dev/null || echo '?')"
    [ -s "$run/verdict.md" ] && printf -- '- the judge: %s\n' "$(head -1 "$run/verdict.md")"
    [ -s "$run/review.md" ] && printf -- '- the review: %s\n' "$(head -1 "$run/review.md")"
    printf '\n```\n%s\n```\n' "$(tail -15 "$run/final-check.log" 2>/dev/null || tail -15 "$run/direct-check.log" 2>/dev/null || echo 'no check log')"
  } > "$r/pr-body.md"
  url=$(gh pr create --head "memdoor/issue-$n" --title "$title" --body-file "$r/pr-body.md")
  printf '%s\n' "$url" | tee "$r/summary.txt"
timeout: 10m
max_retries: 0
