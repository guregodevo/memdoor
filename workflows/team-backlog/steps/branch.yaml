type: command
# A worktree on a branch of its own, memdoor/issue-<n>, from the base branch. Its output is the worktree.
args:
  base: main   # the branch the work starts from and the pull request goes to
when: test -n "{{ output "next" | trim }}"
requires:
  - table_pattern: next
command: |
  git fetch -q origin {{.base}} && git worktree add -q .memdoor/backlog/{{ output "next" | trim }} -b memdoor/issue-{{ output "next" | trim }} origin/{{.base}} && echo .memdoor/backlog/{{ output "next" | trim }}
timeout: 5m
max_retries: 0
