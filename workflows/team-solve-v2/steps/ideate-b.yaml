type: agent
agent: coder
requires:
  - table_pattern: plan
prompt: |
  You are independent ideator B in a fresh context. Read task.md, plan.md,
  and the current notes.md. Develop one concrete alternative from a different
  family than the obvious approach (a program: if the obvious one is dynamic
  programming, try greedy, math or a data structure; a document: a different
  structure, angle or framing), and compare its tradeoffs with the obvious
  approach. For a program: pseudocode, correctness reasoning, complexity,
  off-by-one and overflow checks. For a document: the outline, the claims and
  what backs each, the risks of the angle. Append your proposal to the
  Proposal B section of notes.md by an apply_patch insertion immediately
  before its unique <!-- proposal-b --> marker. Keep the marker and all other
  lines intact: the other ideator writes concurrently to a distinct section.
  Never rewrite notes.md and never write the deliverable. Re-read and retry a
  minimal insertion if the shared ledger changed. Verify your proposal is on
  disk. Do not spawn other agents or rely on chat context.
timeout: 10m
max_retries: 1
