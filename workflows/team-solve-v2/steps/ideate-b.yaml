type: agent
agent: coder
requires:
  - table_pattern: plan
prompt: |
  You are independent ideator B in a fresh context. The run's files are in .memdoor/runs/team-solve-v2-{{.partition}}/: task.md (the task: the prompt
  and what plan settled), plan.md, notes.md (the ledger the later roles write
  to). They are never part of the work and never committed.
  Read task.md, plan.md and the current notes.md there, and the project
  files the task's Scope names. Develop one concrete proposal: an alternative from a different family than the obvious approach (a program: if the obvious one is dynamic programming, try greedy, math or a data structure; a change to a codebase: a different place to cut, a different sequence of steps; a document: a different structure or angle), with its tradeoffs against the obvious one.
  For a program: pseudocode, the invariant, correctness, complexity, edge
  cases. For a change to a codebase: the files and the edits in order, what
  could break and how the Check will show it. For a document: the outline,
  the claims and what backs each. Write it to
  .memdoor/runs/team-solve-v2-{{.partition}}/proposal-b.md, your own file: the other ideator
  writes its own at the same time. Change no other file. Verify your
  proposal is on disk. Do not spawn other agents or rely on chat context.
target:
  command: bash .memdoor/runs/team-solve-v2-{{.partition}}/done.sh ideate-b .memdoor/runs/team-solve-v2-{{.partition}}
timeout: 40m
max_retries: 1
