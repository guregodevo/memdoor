type: agent
agent: coder
requires:
  - table_pattern: problem
prompt: |
  You are the planner in a ledger-based team with fresh contexts. The run's files are in .memdoor/runs/team-solve-v2-{{.partition}}/: task.md (the task: the prompt
  and what plan settled), plan.md, notes.md (the ledger every role writes
  to). They are never part of the work and never committed.
  Read .memdoor/runs/team-solve-v2-{{.partition}}/task.md: its Prompt is the task. Look at the
  project as far as the task needs: the files it names, the build and test
  files, the README. Then fill in the other sections of
  .memdoor/runs/team-solve-v2-{{.partition}}/task.md in place, replacing each comment, keeping
  the Prompt exactly as it is:
  - Deliverable: "changes to this tree" when the task changes the project,
    or the new files by name (a program: solution.py, Python standard library
    only, stdin in, the answer alone on stdout; a document: answer.md).
  - Check: one command in backticks that exits 0 when the work is right
    (the project's own: `go test ./...`, `npm test`, `make check`, scoped to
    what the task touches when the whole suite is slow), run once now on the
    current tree and its result noted in plan.md; the word samples when
    tests/N.in and tests/N.out are in the folder; the word judge when
    nothing can be run.
  - Scope: the files and directories the work may touch.
  - Done when: what the reviewer and the judge check, one line each.
  Write .memdoor/runs/team-solve-v2-{{.partition}}/plan.md: the decomposition, two or three
  candidate approaches with their tradeoffs, and instructions for
  independent ideators, the solver and the reviewer. Initialize
  .memdoor/runs/team-solve-v2-{{.partition}}/notes.md with a title, the run identifier
  {{.partition}}, and the headings Solver decision, Review and Repair. Do
  not do the task and do not change any project file. Verify the three
  files. Communicate only through these files; do not rely on prior
  conversation or delegate agents yourself.
target:
  command: bash .memdoor/runs/team-solve-v2-{{.partition}}/done.sh plan .memdoor/runs/team-solve-v2-{{.partition}}
timeout: 40m
max_retries: 1
