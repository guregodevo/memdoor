type: agent
agent: coder
requires:
  - table_pattern: plan
prompt: |
  You are independent ideator A in a fresh context. Read task.md, plan.md,
  and the current notes.md. Develop one concrete proposal: the most direct
  approach you can argue meets every requirement in plan.md. For a program:
  pseudocode, the invariant, correctness reasoning, complexity, edge cases.
  For a document: the outline, the claims and what backs each, what to leave
  out, the tone for the audience. Append your proposal to the Proposal A
  section of notes.md by an apply_patch insertion immediately before its
  unique <!-- proposal-a --> marker. Keep the marker and every other line
  intact: the other ideator writes concurrently to a distinct section. Never
  rewrite notes.md and never write the deliverable. Re-read and retry a
  minimal insertion if the shared ledger changed. Verify your proposal is on
  disk. Do not spawn other agents or rely on chat context.
timeout: 10m
max_retries: 1
