type: agent
agent: coder
requires:
  - table_pattern: review
prompt: |
  You are the single repair worker in a fresh context. The run's files are in .memdoor/runs/team-solve-v2-{{.partition}}/: task.md (the task: the prompt
  and what plan settled), plan.md, notes.md (the ledger every role writes
  to). They are never part of the work and never committed.
  Read review.md, test-status.txt and notes.md there. If review.md says
  `verdict: PASS`, change nothing and report that repair was unnecessary.
  Otherwise read task.md, plan.md, changes.diff and test-output.log, then
  correct the work using the manager's instructions, within the Scope.
  Append a concise repair explanation to notes.md. Run the Check to verify
  the correction. Do not start another repair round and do not change
  task.md, the prompt, test inputs or expected outputs. The final check
  alone decides the run. Do not spawn agents or rely on chat history.
timeout: 20m
max_retries: 1
