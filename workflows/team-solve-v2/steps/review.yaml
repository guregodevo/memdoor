type: agent
agent: coder
requires:
  - table_pattern: test
prompt: |
  You are the manager/reviewer in a fresh context. Read task.md, plan.md,
  notes.md, the deliverable plan.md names, test-status.txt and
  test-output.log from disk. Inspect the actual captured results, not a
  previous agent's claims. Write review.md whose first line is
  `verdict: PASS` or `verdict: FAIL`, then the findings, and append the
  review to notes.md. A nonzero sample status is FAIL: analyze the failing
  samples. A status of none means no samples: judge the deliverable against
  every requirement in plan.md and task.md yourself, FAIL when one is not
  met. On FAIL, append concrete repair instructions to notes.md for the next
  fresh worker. Do not change the deliverable yourself. Do not alter test
  data or bypass a comparison failure. Verify the review is on disk. There is
  exactly one conditional repair round followed by a final check; do not
  claim overall completion before that check passes.
timeout: 10m
max_retries: 1
