type: agent
agent: coder
requires:
  - table_pattern: ideate-a
  - table_pattern: ideate-b
prompt: |
  You are the solver in a fresh context. Read task.md, plan.md, and notes.md
  from disk, including both proposals. Select and justify an approach in the
  Solver decision section of notes.md, with a brief argument for why it meets
  the requirements. Write the deliverable plan.md names, complete. A program:
  solution.py using Python's standard library, reading stdin and printing
  only the answer, meeting the stated constraints; run it on at least one
  sample when tests/ exist to verify it executes. A document: answer.md,
  every requirement in plan.md met, nothing the task did not ask for. Do not
  change task.md or tests. The downstream steps check the deliverable and the
  manager owns any repair round. Do not spawn agents or use chat context.
timeout: 10m
max_retries: 1
