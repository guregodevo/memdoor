type: command
# On a PASS, the control on the held-out problems and seeds, while the server
# serves the checkpoint heldout-base put back.
when: '{{ if eq (output "judge" | json "pass") "true" }}true{{ else }}false{{ end }}'
requires:
  - table_pattern: settings
  - table_pattern: judge
  - table_pattern: heldout-base
command: |
  '{{ output "settings" | json "janis" }}' eval --url '{{ output "settings" | json "url" }}' --problems '{{ output "settings" | json "heldout" }}' --seed '{{ output "settings" | json "heldout_seed" }}' --max-tokens '{{ output "settings" | json "max_tokens" }}' --parallel '{{ output "settings" | json "parallel" }}' --repetition-penalty '{{ output "settings" | json "control_penalty" }}' --out .memdoor/runs/weight-edit-{{.partition}}/heldout-control.json
timeout: 600m
max_retries: 0
