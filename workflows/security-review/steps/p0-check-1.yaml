type: llm
model: thinking off
# A second look at the lean review's P0 number 1, on the same model, asked
# one question: does the code after the change give anyone access they did not
# have? Qwen3-8B called a case-insensitive ".gguf" match a P0 on a correct
# pull request (guregodevo/llamafit#17, 2026-10-29); verdict demotes a P0
# answered NO to P2. This question kept both real path-traversal P0s and dropped
# that one, 9 of 9 at temperature 0 and 0.7.
when: test -s .memdoor/runs/security-review-{{.partition}}.p0-1
prompt: |
  Here is a code change. Lines starting with - are the code before, lines starting with + the code after.

  ```diff
  {{ file (printf ".memdoor/runs/security-review-%s.diff" .partition) }}
  ```

  A security reviewer says:
  {{ file (printf ".memdoor/runs/security-review-%s.p0-1" .partition) }}

  Does the code after the change let someone read, write or run something they were not allowed to before the change?

  Answer with one word: YES or NO.
requires:
  - table_pattern: p0-list
target:
  file: .memdoor/runs/security-review-{{.partition}}.p0check-1
timeout: 20m
max_retries: 0
