type: command
# The pull request: its diff against the base and the changed files with their
# line counts, its title, description and author, its commits, the
# repository's labels, and the open pull requests and issues (for duplicates).
# The PR comes from the GitHub pull_request event's payload; else from the
# partition when it is a PR number (gh pr view); else from .memdoor/pr.md, a
# title and description written by hand, beside the last commit.
command: |
  set -e
  r=.memdoor/runs/pr-triage-{{.partition}}
  mkdir -p .memdoor/runs
  shallow=$(git rev-parse --is-shallow-repository)
  if [ -n "${GITHUB_BASE_REF:-}" ]; then
    # A pull request: the checkout is the merge of the PR into its base.
    if [ "$shallow" = true ]; then git fetch -q --no-tags --depth=1 origin "$GITHUB_BASE_REF"
    else git fetch -q --no-tags origin "$GITHUB_BASE_REF"; fi
    base=$(git rev-parse FETCH_HEAD)
  else
    if ! git rev-parse -q --verify HEAD~1 >/dev/null && [ "$shallow" = true ]; then
      git fetch -q --no-tags --deepen=1 origin "$(git rev-parse HEAD)" || true
    fi
    if git rev-parse -q --verify HEAD~1 >/dev/null; then base=$(git rev-parse HEAD~1)
    else base=$(git hash-object -t tree /dev/null); fi
  fi
  git diff "$base" > "$r.diff"
  git diff --stat=200 "$base" | sed '$d' > "$r.stat"
  git diff --numstat "$base" > "$r.numstat"
  git rev-parse "$base" > "$r.base"
  # One model call on a small model reads the first 600 lines of the diff.
  head -600 "$r.diff" > "$r.diff-lean"
  [ "$(wc -l < "$r.diff")" -gt 600 ] && echo "… (the diff goes on: $(wc -l < "$r.diff") lines in all)" >> "$r.diff-lean"
  git log --no-decorate --format='--- %h %s%n%b' "$base..HEAD" > "$r.commits" 2>/dev/null || true
  [ -s "$r.commits" ] || echo "(no commit messages)" > "$r.commits"
  p='{{.partition}}'
  if [ -f "${GITHUB_EVENT_PATH:-}" ] && python3 - "$GITHUB_EVENT_PATH" "$r.pr" <<'PY'
  import json, sys
  e = json.load(open(sys.argv[1])).get("pull_request")
  if not e:
      sys.exit(1)
  open(sys.argv[2], "w").write(
      f'pull request #{e["number"]} "{e["title"]}"\nauthor: {e["user"]["login"]} ({e.get("author_association", "").lower() or "unknown"})\n'
      f'from: {e["head"]["repo"]["full_name"] if e.get("head", {}).get("repo") else "a deleted fork"}\n'
      f'description:\n{(e.get("body") or "(empty)")[:6000]}\n')
  PY
  then src="the pull_request event"
  elif expr "$p" : '[0-9][0-9]*$' >/dev/null; then
    gh pr view "$p" --json number,title,author,body -q '"pull request #\(.number) \"\(.title)\"\nauthor: \(.author.login)\ndescription:\n\(.body)"' > "$r.pr"; src="gh pr view $p"
  elif [ -s .memdoor/pr.md ]; then
    cp .memdoor/pr.md "$r.pr"; src=".memdoor/pr.md"
  else
    git log -1 --format='pull request "%s"%nauthor: %an%ndescription:%n%b' > "$r.pr"; src="the last commit"
  fi
  gh label list --limit 200 --json name -q '.[].name' > "$r.labels" 2>/dev/null || : > "$r.labels"
  [ -s "$r.labels" ] || echo "(no labels known: write labels: with nothing after it)" > "$r.labels"
  # Each list on its own: a token that may not read issues keeps the pull requests.
  { gh pr list --state open --limit 100 --json number,title -q '.[] | "#\(.number) \(.title) (pull request)"' || :
    gh issue list --state open --limit 100 --json number,title -q '.[] | "#\(.number) \(.title) (issue)"' || :; } > "$r.open" 2>/dev/null
  [ -s "$r.open" ] || echo "(no open pull requests or issues known)" > "$r.open"
  echo "the pull request from $src: $(git diff --shortstat "$base" | sed 's/^ //')"
timeout: 3m
max_retries: 0
