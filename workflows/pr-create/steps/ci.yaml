type: command
# Waits for the pull request's CI and fails when a check fails. Only with `open: now`.
args:
  open: draft   # draft: nothing was opened, nothing to wait for
  ci: "yes"     # no: the repository has no CI on pull requests, do not wait for one
when: test "{{.open}}" = now && test "{{.ci}}" = yes
requires:
  - table_pattern: open
command: sleep 45 && gh pr checks {{ output "open" | trim }} --watch --interval 20
timeout: 60m
max_retries: 0
