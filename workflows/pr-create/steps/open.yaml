type: command
# Pushes the branch and opens the pull request, only with `open: now`. Its output is the URL.
args:
  open: draft   # draft: push nothing; now: push the branch and open the pull request
  base: main    # the branch the pull request goes to
when: test "{{.open}}" = now
requires:
  - table_pattern: body
command: |
  git push -q -u origin HEAD && gh pr create --base {{.base}} --title "$(head -1 .memdoor/runs/pr-description-{{.partition}}.md)" --body-file .memdoor/runs/pr-create-{{.partition}}/body.md
timeout: 5m
max_retries: 0
