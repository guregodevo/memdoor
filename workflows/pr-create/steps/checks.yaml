type: command
# The repository's checks, run and recorded: the output's last lines, then `exit N`.
args:
  checks: ""   # one shell line, e.g. "make build && make test"; empty: no check is run
when: test -n "{{.checks}}"
requires:
  - table_pattern: merges
command: |
  out=$( ({{.checks}}) 2>&1 ); s=$?; printf '%s\n' "$out" | tail -40; echo "exit $s"
timeout: 60m
max_retries: 0
