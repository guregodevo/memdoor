type: agent
agent: coder
requires:
  - table_pattern: plan
prompt: |
  You are independent ideator B in a fresh context. Read task.md, plan.md,
  and the current notes.md. Develop one concrete alternative proposal,
  favoring sorting prefix states and counting equal-state pairs, and compare
  its tradeoffs with hashing. Include pseudocode, correctness reasoning,
  complexity, and off-by-one/overflow checks. Append your proposal to the
  Proposal B section of notes.md by an apply_patch insertion immediately
  before its unique <!-- proposal-b --> marker. Keep the marker and all other
  lines intact: the other ideator writes concurrently to a distinct section.
  Never rewrite notes.md or modify solution.py. Re-read and retry a minimal
  insertion if the shared ledger changed. Verify your proposal is on disk.
  Do not spawn other agents or rely on chat context.
timeout: 10m
max_retries: 1
