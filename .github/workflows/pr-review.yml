# Every pull request is reviewed by Memdoor's own pr-review workflow, through
# the published action. A pull request from this repository has the OpenRouter
# secret and is reviewed on it by glm-5.3-flash, the full review (the agent
# opens the files and runs what it can): a P0 fails the check. A pull request
# from a fork has no secret, so it is reviewed on a model inside the job
# instead: Qwen3-8B on the runner's CPU, through janis, and its P0s are
# advisory. Both run on pull_request (never pull_request_target: a stranger's
# code never runs beside a secret).
name: PR review (Memdoor)

permissions:
  contents: read

on:
  pull_request:

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Runs on the public repo only: the private one has no Actions minutes, and
# the public tree carries these same files, so its runs are the checks.
jobs:
  review:
    if: github.repository != 'guregodevo/memdoor-private'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.OPEN_ROUTER_API_KEY != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v5

      - name: Review on the OpenRouter key
        if: env.HAS_KEY == 'yes'
        uses: guregodevo/memdoor-action@v1
        with:
          workflow: pr-review
          openrouter-api-key: ${{ secrets.OPEN_ROUTER_API_KEY }}
          model: z-ai/glm-5.3-flash
          timeout: 15m

      - name: Review on a model inside the job (no secret: a fork)
        if: env.HAS_KEY != 'yes'
        uses: guregodevo/memdoor-action@v1
        with:
          workflow: pr-review
          local-model: Qwen3-8B-4bit
          timeout: 25m
