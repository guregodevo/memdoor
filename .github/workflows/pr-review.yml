# Every pull request is reviewed by Memdoor's own pr-review workflow, through
# the published action: the change is read, findings are verified by running
# the code, and the check fails only on a P0 (what must not merge). The
# review is the job summary.
#
# On pull_request, never pull_request_target: a pull request from a fork gets
# no secrets, so no stranger's code ever runs beside the key. Such a pull
# request has no key here, and the review is skipped with a note rather than
# failed.
name: PR review (Memdoor)

permissions:
  contents: read

on:
  pull_request:

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Runs on the public repo only: the private one has no Actions minutes, and
# the public tree carries these same files, so its runs are the checks.
jobs:
  review:
    if: github.repository != 'guregodevo/memdoor-private'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEY: ${{ secrets.OPEN_ROUTER_API_KEY != '' }}
    steps:
      - name: No key for this pull request
        if: env.HAS_KEY != 'true'
        run: |
          echo "::notice::No OPEN_ROUTER_API_KEY for this pull request (a fork gets no secrets): the review is skipped."
          echo "Memdoor's review needs the repository's key; a pull request from a fork has none, so it is not reviewed here." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'true'

      - uses: guregodevo/memdoor-action@v1
        if: env.HAS_KEY == 'true'
        with:
          workflow: pr-review
          openrouter-api-key: ${{ secrets.OPEN_ROUTER_API_KEY }}
          timeout: 25m
