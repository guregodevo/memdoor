# Every pull request is reviewed by Memdoor's own pr-review workflow, through
# the published action, on a model inside the job: Qwen3-8B on the runner's
# CPU, through janis. No key, so a pull request from a fork is reviewed too,
# on pull_request (never pull_request_target: a stranger's code never runs
# beside a secret, and there is none here). A local model's P0s are advisory:
# the check does not fail on them; the review is the job summary.
name: PR review (Memdoor)

permissions:
  contents: read

on:
  pull_request:

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Runs on the public repo only: the private one has no Actions minutes, and
# the public tree carries these same files, so its runs are the checks.
jobs:
  review:
    if: github.repository != 'guregodevo/memdoor-private'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: guregodevo/memdoor-action@v1
        with:
          workflow: pr-review
          local-model: Qwen3-8B-4bit
          timeout: 25m
