# Every pull request is triaged by Memdoor's own pr-triage workflow, through
# the published action, on a model inside the job: Qwen3-8B on the runner's
# CPU, through janis. No key, so a pull request from a fork is triaged too.
# The verdict comes from what the job measures (the test suite on the pull
# request's code, tests claimed but not changed, functions nothing calls); the
# model writes the summary. Advisory: the job never fails on the verdict.
name: PR triage (Memdoor)

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:

concurrency:
  group: pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Runs on the public repo only: the private one has no Actions minutes, and
# the public tree carries these same files, so its runs are the checks.
jobs:
  triage:
    if: github.repository != 'guregodevo/memdoor-private'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # pr-triage runs `go test ./...` (go.mod); the cgo SQLite needs these, as in CI.
    env:
      CGO_CFLAGS: -DSQLITE_ENABLE_FTS5
      CGO_LDFLAGS: -lm
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # gateway/web/embed.go embeds web/dist (gitignored); the cgo SQLite needs its header.
      - name: Build web frontend, install cgo deps
        run: |
          (cd web && npm ci && npm run build)
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - uses: guregodevo/memdoor-action@v1
        with:
          workflow: pr-triage
          local-model: Qwen3-8B-4bit
          timeout: 25m
