# A pull request from this repository is triaged by Memdoor's own pr-triage
# workflow, through the published action, on the OpenRouter secret: the default
# model (GLM 5.3 Flash) reads the diff and the description in one call
# (MEMDOOR_LEAN). The tests are not run here (MEMDOOR_TEST_COMMAND=skip): the
# CI job runs them. Advisory: the job never fails on the verdict. A pull
# request from a fork has no secret and is not triaged here. It runs on
# pull_request, never pull_request_target: a stranger's code never runs beside
# a secret.
name: PR triage (Memdoor)

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:

concurrency:
  group: pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Runs on the public repo only: the private one has no Actions minutes, and
# the public tree carries these same files, so its runs are the checks.
jobs:
  triage:
    if: github.repository != 'guregodevo/memdoor-private'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_KEY: ${{ secrets.OPEN_ROUTER_API_KEY != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v5
        if: env.HAS_KEY == 'yes'

      - name: Triage on the OpenRouter key
        if: env.HAS_KEY == 'yes'
        uses: guregodevo/memdoor-action@v1
        env:
          MEMDOOR_LEAN: '1'
          MEMDOOR_TEST_COMMAND: skip
        with:
          workflow: pr-triage
          openrouter-api-key: ${{ secrets.OPEN_ROUTER_API_KEY }}
          timeout: 8m
