# The published installers, run on each platform GitHub provides: install
# from memdoor.ai exactly as a person does, print the version, start the
# gateway, ask it for its status. Windows is the one nobody on the project
# owns (2026-10-06: the PowerShell installer had refused every install for
# weeks and no machine was there to notice).
name: Installers (from memdoor.ai)

permissions:
  contents: read

# Not on push: the scripts and binaries checked are the ones memdoor.ai
# serves, which change only when a deploy finishes, and a tag push (paths
# filters never apply to tags) landed mid-deploy, after /dl/SHA256SUMS held
# the new hashes but before nginx sent /dl/ to the new release: every
# release failed on a checksum mismatch (2026-10-29). scripts/deploy.sh
# dispatches this run once the site serves the new version.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, in case the site changed under the scripts

# Runs on the public repo only: the private one has no Actions minutes, and
# the public tree carries these same files, so its runs are the checks.
# This repository's runs are the maintainer's: memdoor marks its version
# checks me=1, and make metrics leaves them out.
env:
  MEMDOOR_OWNER: "1"

jobs:
  unix:
    if: github.repository == 'guregodevo/memdoor'
    strategy:
      fail-fast: false   # each platform says its own result
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install
        run: curl -fsSL "https://memdoor.ai/install.sh?ci=1" | MEMDOOR_CI=1 bash
      - name: Version, gateway, status
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          memdoor --version
          nohup memdoor gateway > gw.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:18789/api/status >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18789/api/status
          memdoor setup --non-interactive --admin-email ci@example.test --admin-password ci-first-run-2026 --workspace-name ci
          pkill -f "memdoor gateway" || true
      # The first commands a person types after the install, with no key and
      # no gateway running: `memdoor run` starts the gateway itself and says
      # it has no model (exit 1); every command after it finds that gateway
      # and answers in words (no panic, no "not supported"); the ones with
      # nothing yet say so with exit 1, as on the author's machine.
      - name: First commands, no key
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$HOME/proj" && cd "$HOME/proj"
          check() { want=$1; shift; out=$("$@" 2>&1) && rc=0 || rc=$?; echo "--- $* -> exit $rc"; echo "$out" | head -5
            case "$out" in *panic*|*"not supported"*) echo "FAIL: crashed"; exit 1;; esac
            [ "$rc" = "$want" ] || { echo "FAIL: exit $rc, want $want"; exit 1; }; }
          check 1 memdoor run "reply with ok"
          curl -sf http://127.0.0.1:18789/api/status >/dev/null || { echo "FAIL: memdoor run did not start a gateway"; exit 1; }
          check 0 memdoor doctor
          check 0 memdoor providers
          check 0 memdoor workflow list
          check 0 memdoor cron list
          check 0 memdoor resume
          check 1 memdoor resume --last
          check 1 memdoor remote --last
          pkill -f "memdoor gateway" || true
      # A newcomer's first session (scripts/first-session.sh): a key in the
      # shell, memdoor connect with the key pasted, /connect in the window with
      # the key pasted over the prefilled name; a first turn on each, the key
      # still there after a gateway restart and after the installer runs over
      # the running gateway. The model is the stand-in provider
      # (internal/standin): one fixed reply, only to its own key, no secret.
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: First session, the three ways a model is connected
        run: |
          command -v tmux >/dev/null || { if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get install -y tmux; fi; }
          go build -o "$RUNNER_TEMP/standin" ./internal/standin
          MEMDOOR_BIN="$HOME/.local/bin/memdoor" STANDIN_BIN="$RUNNER_TEMP/standin" UPGRADE=1 scripts/first-session.sh
      # The gateway as a service (memdoor gateway install, 2026-10-23): the
      # unit renders on both platforms; where the runner has a service
      # manager for its user it is installed for real, answers, is restarted
      # by the manager after a kill, and is removed again. A runner without
      # a user bus (systemd --user needs one) prints the unit and says so.
      - name: Gateway as a service
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          memdoor gateway install --print --port 18799 | head -20
          if [ "$RUNNER_OS" = "Linux" ] && ! systemctl --user is-system-running >/dev/null 2>&1; then
            echo "no systemd user instance on this runner: rendered only"; exit 0
          fi
          if [ "$RUNNER_OS" = "macOS" ] && ! launchctl print "gui/$(id -u)" >/dev/null 2>&1; then
            echo "no launchd user session on this runner: rendered only"; exit 0
          fi
          memdoor gateway install --port 18799
          export MEMDOOR_GATEWAY=http://127.0.0.1:18799
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18799/api/status >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18799/api/status >/dev/null || { echo "FAIL: service gateway not answering"; memdoor gateway status; cat ~/.memdoor/gateway.log | tail -20; exit 1; }
          memdoor gateway status
          pid=$(curl -s http://127.0.0.1:18799/api/status | sed -n 's/.*"pid":\([0-9]*\).*/\1/p')
          kill "$pid"
          for i in $(seq 1 30); do sleep 1; curl -sf http://127.0.0.1:18799/api/status >/dev/null && { echo "back after ${i}s"; break; }; done
          curl -sf http://127.0.0.1:18799/api/status >/dev/null || { echo "FAIL: the manager did not restart the gateway"; exit 1; }
          memdoor gateway uninstall
          sleep 2
          curl -sf http://127.0.0.1:18799/api/status >/dev/null && { echo "FAIL: still up after uninstall"; exit 1; } || echo "down after uninstall"

  windows:
    if: github.repository == 'guregodevo/memdoor'
    runs-on: windows-latest
    steps:
      - name: Install
        shell: pwsh
        run: $env:MEMDOOR_CI = '1'; irm 'https://memdoor.ai/install.ps1?ci=1' | iex
      # Windows PowerShell 5.1 is what `irm | iex` runs in for most people (the
      # user agents in the server logs), and its downloads were the slow ones:
      # the install is run there too, over the first, and how long it took is
      # printed.
      - name: Install with Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          $env:MEMDOOR_CI = '1'
          $t = Measure-Command { irm 'https://memdoor.ai/install.ps1?ci=1' | iex }
          "install took $([int]$t.TotalSeconds) s"
          & (Join-Path $env:LOCALAPPDATA 'Memdoor\bin\memdoor.exe') --version
      # The same first commands the pull-request check runs on each build.
      - uses: actions/checkout@v5
      - name: Version, gateway, first account, first commands with no key
        shell: pwsh
        run: ./scripts/windows-first-commands.ps1
      - name: Install again over the running exe (what memdoor upgrade does)
        shell: pwsh
        run: |
          if (-not (Get-Process memdoor -ErrorAction SilentlyContinue)) { throw "no memdoor running; the step proves nothing" }
          $env:MEMDOOR_CI = '1'; irm 'https://memdoor.ai/install.ps1?ci=1' | iex
          $bin = Join-Path $env:LOCALAPPDATA 'Memdoor\bin\memdoor.exe'
          & $bin --version
          Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Memdoor\bin')
      # A newcomer's first session (scripts/windows-first-session.ps1): memdoor
      # connect with the key, a turn, the key still there after the gateway
      # restarts. The stand-in provider is the model (internal/standin).
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: First session, memdoor connect and run
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP\standin.exe" ./internal/standin
          $env:STANDIN_BIN = "$env:RUNNER_TEMP\standin.exe"
          ./scripts/windows-first-session.ps1
      - name: Stop the gateway
        shell: pwsh
        if: always()
        run: Get-Process memdoor -ErrorAction SilentlyContinue | Stop-Process -Force
