# The published installers, run on each platform GitHub provides: install
# from memdoor.ai exactly as a person does, print the version, start the
# gateway, ask it for its status. Windows is the one nobody on the project
# owns (2026-10-06: the PowerShell installer had refused every install for
# weeks and no machine was there to notice).
name: Installers (from memdoor.ai)

permissions:
  contents: read

on:
  push:
    paths:
      - scripts/install.sh
      - scripts/install.ps1
      - .github/workflows/installers.yml
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, in case the site changed under the scripts

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install
        run: curl -fsSL "https://memdoor.ai/install.sh?ci=1" | MEMDOOR_CI=1 bash
      - name: Version, gateway, status
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          memdoor --version
          nohup memdoor gateway > gw.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:18789/api/status >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18789/api/status
          memdoor setup --non-interactive --admin-email ci@example.test --admin-password ci-first-run-2026 --workspace-name ci
          pkill -f "memdoor gateway" || true
      # The first commands a person types after the install, with no key and
      # no gateway running: `memdoor run` starts the gateway itself and says
      # it has no model (exit 1); every command after it finds that gateway
      # and answers in words (no panic, no "not supported"); the ones with
      # nothing yet say so with exit 1, as on the author's machine.
      - name: First commands, no key
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$HOME/proj" && cd "$HOME/proj"
          check() { want=$1; shift; out=$("$@" 2>&1) && rc=0 || rc=$?; echo "--- $* -> exit $rc"; echo "$out" | head -5
            case "$out" in *panic*|*"not supported"*) echo "FAIL: crashed"; exit 1;; esac
            [ "$rc" = "$want" ] || { echo "FAIL: exit $rc, want $want"; exit 1; }; }
          check 1 memdoor run "reply with ok"
          curl -sf http://127.0.0.1:18789/api/status >/dev/null || { echo "FAIL: memdoor run did not start a gateway"; exit 1; }
          check 0 memdoor doctor
          check 0 memdoor providers
          check 0 memdoor workflow list
          check 0 memdoor cron list
          check 0 memdoor conversations
          check 1 memdoor resume --last
          check 1 memdoor remote --last
          pkill -f "memdoor gateway" || true

  windows:
    runs-on: windows-latest
    steps:
      - name: Install
        shell: pwsh
        run: $env:MEMDOOR_CI = '1'; irm 'https://memdoor.ai/install.ps1?ci=1' | iex
      - name: Version, gateway, status
        shell: pwsh
        run: |
          $bin = Join-Path $env:LOCALAPPDATA 'Memdoor\bin\memdoor.exe'
          & $bin --version
          $gw = Start-Process -FilePath $bin -ArgumentList 'gateway' -PassThru -RedirectStandardOutput gw.log -RedirectStandardError gw.err
          $ok = $false
          foreach ($i in 1..40) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18789/api/status | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { Get-Content gw.log, gw.err; throw "gateway did not answer" }
          (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18789/api/status).Content
          & $bin setup --non-interactive --admin-email ci@example.test --admin-password ci-first-run-2026 --workspace-name ci
          Stop-Process -Id $gw.Id
      - name: First commands, no key (a new shell finds memdoor on PATH)
        shell: pwsh
        run: |
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike "*Memdoor\bin*") { throw "installer did not put Memdoor\bin on the user PATH" }
          $env:Path = "$env:Path;" + (Join-Path $env:LOCALAPPDATA 'Memdoor\bin')
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\proj" | Out-Null
          Set-Location "$env:USERPROFILE\proj"
          function Check($want, [string[]]$cmd) {
            $out = & memdoor @cmd 2>&1 | Out-String; $rc = $LASTEXITCODE
            Write-Host "--- memdoor $cmd -> exit $rc"; Write-Host ($out.Substring(0, [Math]::Min(400, $out.Length)))
            if ($out -match 'panic|not supported') { throw "crashed: memdoor $cmd" }
            if ($rc -ne $want) { throw "memdoor $cmd exit $rc, want $want" }
          }
          Check 1 @('run','reply with ok')
          try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18789/api/status | Out-Null } catch { throw "memdoor run did not start a gateway" }
          Check 0 @('doctor')
          Check 0 @('providers')
          Check 0 @('workflow','list')
          Check 0 @('cron','list')
          Check 0 @('conversations')
          Check 1 @('resume','--last')
          Check 1 @('remote','--last')
      - name: Stop the gateway
        shell: pwsh
        if: always()
        run: Get-Process memdoor -ErrorAction SilentlyContinue | Stop-Process -Force
